[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gdsn-tsv-transformer"
version = "0.1.0"
description = "Transform GDSN UML JSON dumps into uml2semantics TSV artefacts."
requires-python = ">=3.14.4,<3.15"
classifiers = ["Programming Language :: Python :: 3.14", "Programming Language :: Python :: Implementation :: CPython"]
dependencies = [
  "lxml==6.1.3",
  "pyshacl==0.40.1",
  "rdflib==7.6.0",
  "xml2rfc==3.34.1",
  "zensical",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
owl-jsonld = "gdsn_tsv_transformer.jsonld.cli:main"
gdsn-json-to-tsv = "gdsn_tsv_transformer.cli:main"
google-taxonomy-to-tsv = "gdsn_tsv_transformer.google_taxonomy:main"
gs1-gdsn-holon = "gdsn_tsv_transformer.holon:main"
gdsn-xml-to-rdf = "gdsn_tsv_transformer.xml_to_rdf:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gdsn_tsv_transformer.jsonld" = ["py.typed", "w3c/*", "w3c/fromRdf/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
